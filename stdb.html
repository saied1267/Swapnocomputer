  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e0f7fa;
      margin: 0;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #004080;
      margin-bottom: 30px;
    }
    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }
    .card {
      color: white;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 8px 15px rgba(0,0,0,0.2);
      cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 20px rgba(0,0,0,0.3);
    }
    .student-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 6px;
    }
    .student-course {
      color: #ffd700;
      font-size: 14px;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }
    .modal-content {
      background: #fefefe;
      padding: 25px;
      border-radius: 12px;
      width: 380px;
      animation: fadeIn 0.3s ease;
      box-shadow: 0 8px 25px rgba(0,0,0,0.3);
    }
    @keyframes fadeIn {
      from {opacity:0; transform: scale(0.9);}
      to {opacity:1; transform: scale(1);}
    }
    .modal input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 14px;
      transition: border 0.3s;
    }
    .modal input:focus {
      border-color: #2575fc;
      outline: none;
    }
    .modal input.error {
      border-color: red;
      animation: shake 0.3s;
    }
    @keyframes shake {
      0% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      50% { transform: translateX(5px); }
      75% { transform: translateX(-5px); }
      100% { transform: translateX(0); }
    }
    .error-message {
      color: red;
      font-size: 14px;
      margin: 5px 0;
      display: none;
    }
    .details {
      margin-top: 15px;
      background: #f1f8e9;
      padding: 15px;
      border-radius: 10px;
      border-left: 4px solid #4caf50;
    }
    .details p {
      margin: 6px 0;
      font-size: 14px;
      color: #333;
    }
    .details b {
      color: #004080;
    }
    .close-btn {
      background: red;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      float: right;
    }
    .submit-btn {
      background: #004080;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.3s;
    }
    .submit-btn:hover {
      background: #2575fc;
    }
  </style>
</head>

  'linear-gradient(135deg, #ff5f6d, #ffc371)',

const cardContainer = document.getElementById("cardContainer");
students.forEach((s, i) => {
  const card = document.createElement("div");
  card.className = "card";
  card.style.background = gradients[i % gradients.length];
  card.innerHTML = `<div class="student-name">${s.name}</div>
                    <div class="student-course">${s.course}</div>`;
  card.onclick = () => openModal(i);
  cardContainer.appendChild(card);
});

let currentStudent = null;

function openModal(index) {
  currentStudent = students[index];
  document.getElementById("modal").style.display = "flex";
  document.getElementById("modalTitle").innerText = currentStudent.name;
  document.getElementById("authSection").style.display = "block";
  document.getElementById("detailsSection").style.display = "none";
  document.getElementById("rollInput").value = "";
  document.getElementById("pinInput").value = "";
  document.getElementById("errorMsg").style.display = "none";
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

function checkAuth() {
  const rollInput = document.getElementById("rollInput");
  const pinInput = document.getElementById("pinInput");
  const errorMsg = document.getElementById("errorMsg");

  if (rollInput.value === currentStudent.roll && pinInput.value === currentStudent.pin) {
  
    document.getElementById("authSection").style.display = "none";
    const detailsHTML = `
      <div class="details">
        <p><b>Father:</b> ${currentStudent.father}</p>
        <p><b>Mother:</b> ${currentStudent.mother}</p>
        <p><b>Address:</b> ${currentStudent.address}</p>
        <p><b>Mobile:</b> ${currentStudent.mobile}</p>
        <p><b>Course:</b> ${currentStudent.course}</p>
        <p><b>Roll:</b> ${currentStudent.roll}</p>
        
      </div>`;
    document.getElementById("detailsSection").innerHTML = detailsHTML;
    document.getElementById("detailsSection").style.display = "block";

  } else {
    errorMsg.style.display = "block";
    rollInput.classList.add("error");
    pinInput.classList.add("error");
    setTimeout(() => {
      rollInput.classList.remove("error");
      pinInput.classList.remove("error");
    }, 500);
  }
}
