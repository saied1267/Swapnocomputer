<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Form</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h2 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .input-group {
            position: relative;
            margin-bottom: 25px;
        }

        .input-group input {
            width: 100%;
            padding: 15px 20px;
            border-radius: 50px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .input-group input:focus {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.3);
        }

        .forgot-password {
            display: block;
            margin-top: 10px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .forgot-password:hover {
            color: #ffd700;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #ffd700, #ffaa00);
            color: #000;
            font-size: 18px;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            margin: 30px 0;
            transition: all 0.4s ease;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(255, 215, 0, 0.4);
        }

        .social-login {
            margin-top: 20px;
        }

        .social-login p {
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 15px;
            font-size: 14px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .social-btn:hover {
            transform: scale(1.1);
        }

        .fb { background: #1877f2; }
        .x { background: #000000; }
        .google { background: #db4437; }

        .social-btn i {
            color: white;
            font-size: 20px;
        }

        .signup-link {
            margin-top: 25px;
            color: #ffd700;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        .signup-link:hover {
            text-decoration: underline;
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <h2> Student LOGIN</h2>
        
        <form>
            <div class="input-group">
                <input type="email" placeholder="Student Name" required id="rollinput">
            </div>
            
            <div class="input-group">
                <input type="password" placeholder="Student Pin" required id="passinput">
                <p id="error" style="color:red; display:none;">ভুল পিন! আবার চেষ্টা করুন।</p>
            </div>
            
            
            <a href="#" class="forgot-password">Forgot Your Password ?</a>
            
            <button type="submit" class="login-btn">LOGIN</button>
        </form>
        
        <div class="social-login">
            <p>Desgined By Saiyed Sir</p>
            <div class="social-buttons">
                <div class="social-btn fb">
                    <i class="fab fa-facebook-f"></i>
                </div>
                <div class="social-btnx">
                    <i class="fab fa-x-twitter"></i>
                </div>
                <div class="social-btn google">
                    <i class="fab fa-google"></i>
                </div>
            </div>
        </div>
        
        <a href="index.html" class="signup-link">Home</a>
    </div>
</body>
</html>
