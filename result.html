<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<title>Excel Exam Results</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #f0f4f8;
    margin:0;
    padding:20px;
  }
  h1 {
    text-align:center;
    color:#004080;
    margin-bottom:30px;
  }
  .card-container {
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(250px,1fr));
    gap:20px;
  }
  .card {
    background: linear-gradient(135deg,#6a11cb,#2575fc);
    color:white;
    padding:20px;
    border-radius:15px;
    cursor:pointer;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .card:hover {
    transform:scale(1.05);
    box-shadow:0 12px 20px rgba(0,0,0,0.3);
  }
  .student-name {
    font-size:20px;
    font-weight:bold;
  }
  /* Modal */
  .modal {
    display:none;
    position:fixed;
    top:0;left:0;right:0;bottom:0;
    background: rgba(0,0,0,0.6);
    justify-content:center;
    align-items:center;
    z-index:1000;
  }
  .modal-content {
    background:#fff;
    padding:25px;
    border-radius:12px;
    width:600px;
    max-width:95%;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
  }
  .modal input {
    width:100%;
    padding:10px;
    margin:8px 0;
    border:2px solid #ccc;
    border-radius:8px;
    font-size:14px;
  }
  .modal input.error {
    border-color:red;
    animation:shake 0.5s;
  }
  @keyframes shake {
    0%{transform:translateX(0);}
    25%{transform:translateX(-8px);}
    40%{transform:translateX(8px);}
    50%{transform:translateX(-8px);}
    55%{transform:translateX(5px);}
    70%{transform:translateX(-8px);}
    80%{transform:translateX(8px);}
    90%{transform:translateX(-8px);}
    
    100%{transform:translateX(0);}
  }
  .error-message {
    color:red;
    display:none;
    margin-bottom:8px;
  }
  .close-btn {
    background:red;
    color:white;
    border:none;
    padding:6px 12px;
    border-radius:6px;
    cursor:pointer;
    float:right;
  }
  .submit-btn {
    background:#004080;
    color:white;
    border:none;
    padding:8px 16px;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
  }
  .submit-btn:hover {
    background:#2575fc;
  }
  .result-table {
    width:100%;
    border-collapse:collapse;
    margin-top:15px;
  }
  .result-table th, .result-table td {
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
  }
  .pass {
    background:#c8e6c9;
    color:#256029;
  }
  .fail {
    background:#ffcdd2;
    color:#c62828;
  }
</style>
</head>
<body>

<h1>Excel Exam Results</h1>
<div class="card-container" id="cardContainer"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <button class="close-btn" onclick="closeModal()">X</button>
    <h3 id="modalTitle"></h3>
    <div id="authSection">
      <input type="password" id="pinInput" placeholder="Enter Pin">
      <div class="error-message" id="errorMsg">❌ Wrong Pin</div>
      <button class="submit-btn" onclick="checkPin()">Submit</button>
    </div>
    <div id="resultSection" style="display:none;"></div>
  </div>
</div>

<script>
const students=[
  {name:"Tusha Chowdori", pin:"2020", result:{mcq:36, mcqStatus:"Pass", practical:12, practicalStatus:"Fail", status:"Fail", total:0, totalPercent:0, point:0, grade:"Fail"}},
  {name:"Sadia Sultana", pin:"2010", result:{mcq:42, mcqStatus:"Pass", practical:22, practicalStatus:"Pass", status:"Pass", total:64, totalPercent:64, point:3.5, grade:"A-"}},
  {name:"Supriti Shil", pin:"2006", result:{mcq:41, mcqStatus:"Pass", practical:24, practicalStatus:"Pass", status:"Pass", total:65, totalPercent:65, point:3.5, grade:"A-"}},
  {name:"Faizan Ramim", pin:"2007", result:{mcq:40, mcqStatus:"Pass", practical:27, practicalStatus:"Pass", status:"Pass", total:67, totalPercent:67, point:3.5, grade:"A-"}},
  {name:"Rakibul Hasan Akash", pin:"2024", result:{mcq:36, mcqStatus:"Pass", practical:22, practicalStatus:"Pass", status:"Pass", total:58, totalPercent:58, point:3, grade:"B"}},
  {name:"Minhazul Kabir Tamim", pin:"2009", result:{mcq:44, mcqStatus:"Pass", practical:36, practicalStatus:"Pass", status:"Pass", total:80, totalPercent:80, point:5, grade:"A+"}},
  {name:"Sayeed Hosain Fahim", pin:"1234", result:{mcq:39, mcqStatus:"Pass", practical:12, practicalStatus:"Fail", status:"Fail", total:0, totalPercent:0, point:0, grade:"Fail"}},
  {name:"Tanjibul Islam Tawsif", pin:"2027", result:{mcq:41, mcqStatus:"Pass", practical:17, practicalStatus:"Pass", status:"Pass", total:58, totalPercent:58, point:3, grade:"B"}},
  {name:"Saidul Islam Afif", pin:"2028", result:{mcq:47, mcqStatus:"Pass", practical:0, practicalStatus:"Fail", status:"Fail", total:0, totalPercent:0, point:0, grade:"Fail"}},
  {name:"Ismat Jerin Nikita", pin:"2029", result:{mcq:45, mcqStatus:"Pass", practical:26, practicalStatus:"Pass", status:"Pass", total:71, totalPercent:71, point:4, grade:"A"}},
  {name:"Nusrat Alam", pin:"1885", result:{mcq:46, mcqStatus:"Pass", practical:26, practicalStatus:"Pass", status:"Pass", total:72, totalPercent:72, point:4, grade:"A"}}
];

const cardContainer=document.getElementById("cardContainer");
const gradients=[
  'linear-gradient(135deg,#6a11cb,#2575fc)',
  'linear-gradient(135deg,#ff5f6d,#ffc371)',
  'linear-gradient(135deg,#43cea2,#185a9d)'
];

students.forEach((s,i)=>{
  const card=document.createElement("div");
  card.className="card";
  card.style.background=gradients[i%gradients.length];
  card.innerHTML=`<div class="student-name">${s.name}</div>`;
  card.onclick=()=>openModal(i);
  cardContainer.appendChild(card);
});

let currentStudent=null;

function openModal(index){
  currentStudent=students[index];
  document.getElementById("modal").style.display="flex";
  document.getElementById("modalTitle").innerText=currentStudent.name;
  document.getElementById("authSection").style.display="block";
  document.getElementById("resultSection").style.display="none";
  document.getElementById("pinInput").value="";
  document.getElementById("errorMsg").style.display="none";
}

function closeModal(){
  document.getElementById("modal").style.display="none";
}

function checkPin(){
  const pinInput=document.getElementById("pinInput");
  const errorMsg=document.getElementById("errorMsg");
  if(pinInput.value===currentStudent.pin){
    document.getElementById("authSection").style.display="none";
    showResult();
  }else{
    errorMsg.style.display="block";
    pinInput.classList.add("error");
    setTimeout(()=>{pinInput.classList.remove("error");},500);
  }
}

function showResult(){
  const r=currentStudent.result;
  let cls=r.status==="Fail"?"fail":"pass";
  let html=`<table class="result-table">
    <tr>
      <th>MCQ Mark</th>
      <th>Status</th>
      <th>Practical Mark</th>
      <th>Status</th>
      <th>Overall Status</th>
      <th>Total</th>
      <th>Total %</th>
      <th>Point</th>
      <th>Grade</th>
    </tr>`;
  html+=`<tr class="${cls}">
    <td>${r.mcq}</td>
    <td>${r.mcqStatus}</td>
    <td>${r.practical}</td>
    <td>${r.practicalStatus}</td>
    <td>${r.status}</td>
    <td>${r.total}</td>
    <td>${r.totalPercent}</td>
    <td>${r.point}</td>
    <td>${r.grade}</td>
  </tr>`;
  html+="</table>";
  document.getElementById("resultSection").innerHTML=html;
  document.getElementById("resultSection").style.display="block";
}
</script>

</body>
</html>
