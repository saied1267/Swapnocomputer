<!DOCTYPE html>
<html>
<head>
  <title>Facebook Style Menu</title>
  <style>
    nav {
      background: #1877f2;
      padding: 10px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 15px;
      font-size: 18px;
    }
    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#home">Home</a>
    <a href="#menu">Menu</a>
    <a href="#profile">Profile</a>
    <a href="#friends">Friends</a>
  </nav>
</body>
</html>
